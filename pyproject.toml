[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pagerduty-auto-ack"
version = "0.2.0"
description = "Acknowledge PagerDuty incidents only while the configured user is on call."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "nithishduda-ai" }
]
keywords = ["pagerduty", "incident-response", "on-call", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nithishduda-ai/pagerduty-auto-ack"
Repository = "https://github.com/nithishduda-ai/pagerduty-auto-ack"
Issues = "https://github.com/nithishduda-ai/pagerduty-auto-ack/issues"

[project.scripts]
pd-auto-ack = "pagerduty_auto_ack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
