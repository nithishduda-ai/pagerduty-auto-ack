[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pagerduty-oncall-ack"
version = "0.4.1"
description = "Acknowledge PagerDuty incidents only while the configured user is on call."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "nithishduda-ai" }
]
keywords = ["pagerduty", "incident-response", "on-call", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities"
]
dependencies = []

[project.urls]
Homepage = "https://nithishduda-ai.github.io/pagerduty-oncall-ack/"
Documentation = "https://nithishduda-ai.github.io/pagerduty-oncall-ack/"
Repository = "https://github.com/nithishduda-ai/pagerduty-oncall-ack"
Issues = "https://github.com/nithishduda-ai/pagerduty-oncall-ack/issues"
Changelog = "https://github.com/nithishduda-ai/pagerduty-oncall-ack/blob/main/CHANGELOG.md"
Security = "https://github.com/nithishduda-ai/pagerduty-oncall-ack/security/policy"

[project.scripts]
pd-auto-ack = "pagerduty_oncall_ack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
